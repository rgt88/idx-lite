name: alarm
# Kirim pesan Telegram setiap kali salah satu workflow data gagal (merah).
on:
  workflow_run:
    workflows: [makro, harga, fundamental, kepemilikan, brief, foreign-broker, sinyal, laporan-ai, situs, pengatur, uji]
    types: [completed]
permissions:
  contents: read
jobs:
  kirim:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHATS: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          CONCL: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHATS" ]; then echo "secret Telegram belum diisi"; exit 0; fi
          WAKTU=$(TZ=Asia/Jakarta date '+%d %b %H:%M')
          TEXT=$(printf '⚠️ IDX Lite: workflow %s %s (%s, %s WIB)\nLog: %s\nJalankan ulang: Actions → %s → Re-run' "$NAME" "$CONCL" "$EVENT" "$WAKTU" "$URL" "$NAME")
          IFS=',' read -ra IDS <<< "$CHATS"
          for id in "${IDS[@]}"; do
            curl -sS -m 20 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${id// /}" --data-urlencode "text=${TEXT}" \
              -d disable_web_page_preview=true -o /dev/null -w "%{http_code}\n" || true
          done
