name: bei
# Data resmi BEI tanpa akun: ringkasan saham (beli/jual ASING per saham), semua indeks (termasuk 11 indeks sektor)
# dan total transaksi per broker. Cloudflare BEI ditembus dengan curl_cffi lalu, kalau perlu, browser Chromium.
# Dipicu pengatur setelah 16:20 WIB dan diulang sampai sesi hari ini masuk; cadangan 16:47 dan 19:47 WIB.
on:
  schedule:
    - cron: "47 9,12 * * 1-5"
  workflow_dispatch:
    inputs:
      hari:
        description: "Berapa hari bursa ke belakang yang dicek/diisi (pertama kali: 40)"
        default: "5"
      cara:
        description: "auto | curl | browser"
        default: auto
permissions:
  contents: write
concurrency:
  group: data-bei
  cancel-in-progress: false
jobs:
  bei:
    # Variabel repo BEI_RUNNER=self-hosted -> jalan di laptop (runner self-hosted) yang diterima Cloudflare BEI.
    runs-on: ${{ vars.BEI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Pasang curl_cffi dan Chromium
        run: |
          pip install -q curl_cffi playwright
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then python -m playwright install --with-deps chromium > /dev/null; else python -m playwright install chromium > /dev/null || true; fi
      - uses: ./.github/actions/restore
        with:
          paths: data/idx
      - name: Ambil data BEI
        run: timeout 25m python scripts/fetch_idx.py --days "${{ inputs.hari || '5' }}" --method "${{ inputs.cara || 'auto' }}"
      - uses: ./.github/actions/publish
        if: always()
        with:
          paths: data/idx
          message: bei
