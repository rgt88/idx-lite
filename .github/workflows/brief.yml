name: brief
# Brief per saham (idx stocks brief), 100 saham per run bergilir (atau semua saham dengan isi_semua=true). 17:15 WIB.
on:
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      max:
        description: Jumlah saham
        default: "100"
      isi_semua:
        description: "Isi semua saham: jalan berulang otomatis (±40 menit per putaran) sampai semua saham punya data"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: data-brief
  cancel-in-progress: false
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          idx: "true"
          cache-key: idx-brief
      - uses: ./.github/actions/restore
        with:
          paths: |
            data/summary.json
            data/brief
            data/brief_index.json
      - name: Database kepemilikan (untuk bagian pemegang saham)
        run: idx ownership sync || echo "sync gagal; brief tanpa data kepemilikan"
      - id: ambil
        run: |
          MAX="${{ inputs.max || '100' }}"
          EXTRA=""
          [ "${{ inputs.isi_semua }}" = "true" ] && { MAX=5000; EXTRA=--only-missing; }
          timeout 42m python scripts/fetch_brief.py --max "$MAX" --budget 36 $EXTRA || echo "berhenti lebih awal; yang sudah jadi tetap diterbitkan"
      - uses: ./.github/actions/publish
        with:
          paths: |
            data/brief
            data/brief_index.json
          message: brief
      - name: Lanjut putaran berikutnya (mode isi semua)
        if: inputs.isi_semua && steps.ambil.outputs.left != '0' && steps.ambil.outputs.ok != '0' && steps.ambil.outputs.ok != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "masih ${{ steps.ambil.outputs.left }} saham; jalankan putaran berikutnya"
          gh workflow run brief.yml --repo "$GITHUB_REPOSITORY" --ref main -f isi_semua=true
