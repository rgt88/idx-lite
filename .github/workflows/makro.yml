name: makro
# USD/IDR, IHSG, WTI, CDS, yield. 08, 10, 12, 14, 16, 19 WIB
on:
  schedule:
    - cron: "0 1,3,5,7,9,12 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-makro
  cancel-in-progress: false
jobs:
  makro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore
        with:
          paths: data/data.json
      - run: python scripts/macro_update.py
      - uses: ./.github/actions/publish
        with:
          paths: data/data.json
          message: makro
