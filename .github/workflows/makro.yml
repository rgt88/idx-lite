name: makro
# USD/IDR, IHSG, WTI, CDS, yield + TradingView (heatmap sektor, komoditas, yield 1Y). 08, 10, 12, 14, 16, 19 WIB
on:
  schedule:
    - cron: "0 1,3,5,7,9,12 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-makro
  cancel-in-progress: false
jobs:
  makro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/restore
        with:
          paths: |
            data/data.json
            data/macro_series.json
            data/macro_hist.json
            data/tv
            data/cds.json
      - name: TradingView (sektor, komoditas, yield 1Y)
        run: timeout 5m python scripts/fetch_tv.py || echo "TradingView gagal; data lama dipakai"
      - run: python scripts/macro_update.py
      - uses: ./.github/actions/publish
        with:
          paths: |
            data/data.json
            data/macro_series.json
            data/macro_hist.json
            data/tv
          message: makro
