name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1,3,5,7 * * 1-5"    # makro saja: 08, 10, 12, 14 WIB
    - cron: "30 9 * * 1-5"         # makro + harga semua saham: 16:30 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ambil data dari situs sebelumnya
        run: |
          if git clone --depth 1 --branch gh-pages \
               "https://github.com/${{ github.repository }}.git" /tmp/site 2>/dev/null; then
            mkdir -p docs/data
            rsync -a --ignore-existing /tmp/site/data/ docs/data/
          else
            echo "Branch gh-pages belum ada, mulai dari nol"
          fi

      - name: Update makro
        run: python scripts/macro_update.py

      - name: Update harga saham
        continue-on-error: true
        env:
          SCHED: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SCHED" = "30 9 * * 1-5" ] || [ ! -f docs/data/summary.json ]; then
            python scripts/fetch_prices.py
          else
            echo "Lewati update harga pada run ini"
          fi

      - name: Update fundamental (bertahap)
        continue-on-error: true
        env:
          SCHED: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SCHED" = "30 9 * * 1-5" ]; then
            python scripts/fetch_fundamentals.py --max 100
          else
            echo "Lewati update fundamental pada run ini"
          fi

      - name: Deploy ke gh-pages
        run: |
          cd docs
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
