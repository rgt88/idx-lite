name: situs
# Menerbitkan kode tampilan (HTML/JS/CSS, hsc.json, manual.json). Data tidak disentuh.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: situs
  cancel-in-progress: true
jobs:
  situs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish
        with:
          paths: "*"
          message: situs
